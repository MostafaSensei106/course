spring.application.name=course

# --- Datasource (matches compose.yaml: POSTGRES_DB=mydatabase, USER=root, PASS=root) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- Flyway (no-op until migrations are added) ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# --- Jackson ---
spring.jackson.deserialization.fail-on-unknown-properties=false

# --- JWT ---
app.jwt.secret=change-me-to-a-very-long-secret-key-for-hs256-min-32-bytes-please!!
app.jwt.access-expiration-seconds=3600
app.jwt.refresh-expiration-seconds=604800

# --- Swagger / OpenAPI (springdoc) ---
# Interactive UI: http://localhost:8080/swagger-ui/index.html
# Raw JSON (Postman import): http://localhost:8080/v3/api-docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# --- Docker compose integration (dev only) ---
spring.docker.compose.enabled=true

# --- Router ---
app.router.log-routes=true

# --- Logging ---
# requestId (X-Request-Id) is attached to every request by RequestLoggingFilter
logging.pattern.console=%d{HH:mm:ss} [%X{requestId}] %-5level %logger{36} - %msg%n
app.logging.http.enabled=true
app.logging.http.skip-paths=/actuator,/favicon.ico
