spring.application.name=course

# --- Datasource (matches compose.yaml: POSTGRES_DB=mydatabase, USER=root, PASS=root) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
# --- Violent-load tuning (Thanaweya Amma scale) ---
spring.threads.virtual.enabled=true
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=50
server.tomcat.max-connections=2000
server.tomcat.accept-count=500
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.max-lifetime=300000

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- Flyway (no-op until migrations are added) ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# --- Jackson ---
spring.jackson.deserialization.fail-on-unknown-properties=false


# --- Swagger / OpenAPI (springdoc) ---
# Interactive UI: http://localhost:8080/swagger-ui/index.html
# Raw JSON (Postman import): http://localhost:8080/v3/api-docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

spring.docker.compose.enabled=true

# --- Router ---

# --- Logging ---
# requestId (X-Request-Id) is attached to every request by RequestLoggingFilter
logging.pattern.console=%d{HH:mm:ss} [%X{requestId}] %-5level %logger{36} - %msg%n
