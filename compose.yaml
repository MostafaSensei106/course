services:
  postgres:
    image: "postgres:latest"
    environment:
      - "POSTGRES_DB=mydatabase"
      - "POSTGRES_PASSWORD=root"
      - "POSTGRES_USER=root"
    ports:
      - "5432:5432"
    command:
      [
        "-c",
        "max_connections=300",
        "-c",
        "shared_buffers=512MB",
        "-c",
        "effective_cache_size=2GB",
      ]
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
